<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" style="background:#0c0a09; font-family:'Inter',system-ui,sans-serif;">
  <style>
    .grid { stroke: #201d1a; stroke-width: 1; }
    .title { font-size: 15px; font-weight: 700; fill: #fafaf9; letter-spacing: 0.5px; }
    .sub { font-size: 11px; fill: #a8a29e; font-family: monospace; }
    .axis { font-size: 11px; fill: #78716c; font-family: monospace; }
    .box { fill: #141210; stroke: #3d3832; stroke-width: 1; rx: 6px; }
  </style>

  <!-- Header Box -->
  <rect x="25" y="15" width="950" height="85" class="box" />
  <text x="40" y="38" class="title">TRAFFIC VELOCITY: CLIENT RPS vs TASK COMPLETION TPS</text>
  <text x="40" y="58" class="sub">Evaluates ingress rate (RPS) vs cluster processing capacity (TPS)</text>
  <line x1="100" y1="88" x2="120" y2="88" stroke="#f59e0b" stroke-width="2.0" stroke-dasharray="4,4" /><text x="128" y="92" class="axis" fill="#fafaf9">Incoming Client RPS</text><line x1="312" y1="88" x2="332" y2="88" stroke="#10b981" stroke-width="2.5" /><text x="340" y="92" class="axis" fill="#fafaf9">Completed Tasks TPS</text>

  <!-- Plot Background -->
  <rect x="90" y="110" width="830" height="340" fill="#141210" stroke="#27231f" />

  <!-- Grid & Axes -->
  <line x1="90" y1="450.0" x2="920" y2="450.0" class="grid" /><line x1="90" y1="365.0" x2="920" y2="365.0" class="grid" /><line x1="90" y1="280.0" x2="920" y2="280.0" class="grid" /><line x1="90" y1="195.0" x2="920" y2="195.0" class="grid" /><line x1="90" y1="110.0" x2="920" y2="110.0" class="grid" /><line x1="90.0" y1="110" x2="90.0" y2="450" class="grid" /><line x1="297.5" y1="110" x2="297.5" y2="450" class="grid" /><line x1="505.0" y1="110" x2="505.0" y2="450" class="grid" /><line x1="712.5" y1="110" x2="712.5" y2="450" class="grid" /><line x1="920.0" y1="110" x2="920.0" y2="450" class="grid" />
  <text x="78" y="454.0" class="axis" text-anchor="end">0.0 req/s</text><text x="78" y="369.0" class="axis" text-anchor="end">2.2 req/s</text><text x="78" y="284.0" class="axis" text-anchor="end">4.5 req/s</text><text x="78" y="199.0" class="axis" text-anchor="end">6.8 req/s</text><text x="78" y="114.0" class="axis" text-anchor="end">9.0 req/s</text>
  <text x="90.0" y="490" class="axis" text-anchor="start">0.0s</text><text x="297.5" y="490" class="axis" text-anchor="middle">10.5s</text><text x="505.0" y="490" class="axis" text-anchor="middle">21.0s</text><text x="712.5" y="490" class="axis" text-anchor="middle">31.5s</text><text x="920.0" y="490" class="axis" text-anchor="end">42.0s</text>
  <text x="505.0" y="508" class="axis" text-anchor="middle">Elapsed Time (seconds)</text>

