  <text x="90" y="620" class="axis">0s</text>
  <text x="500.0" y="620" class="axis" text-anchor="middle">Elapsed Time (94.0s)</text>
  <text x="910" y="620" class="axis" text-anchor="end">94.0s</text>

  <!-- Left Y-Axis (Percentages) -->
  <text x="35" y="190" class="axis">100%</text>
  <text x="35" y="301.0" class="axis" fill="#ea580c">70%</text>
  <text x="35" y="375.0" class="axis">50%</text>
  <text x="35" y="570" class="axis">0%</text>

  <!-- Legend -->
  <circle cx="110" cy="205" r="5" fill="#ea580c" />
  <text x="122" y="209" class="axis" fill="#fafaf9">Average CPU % (all workers)</text>

  <circle cx="330" cy="205" r="5" fill="#3b82f6" />
  <text x="342" y="209" class="axis" fill="#fafaf9">Average Memory % (all workers)</text>
</svg>
